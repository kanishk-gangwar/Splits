org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 refuses `com.android.application` + `org.jetbrains.kotlin.multiplatform`
# in one module unless its built-in Kotlin support and new DSL are turned off.
# This keeps the single-module Compose Multiplatform layout used by the KMP wizard.
android.builtInKotlin=false
android.newDsl=false
