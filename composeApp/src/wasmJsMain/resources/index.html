<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Splits</title>

  <!-- Installable on iPhone via Safari → Share → Add to Home Screen. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Splits">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#7C5CFF">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #121212;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #ffffff; }
    }
    /* Keep the app clear of the notch and the home indicator. */
    #app {
      position: fixed;
      top: env(safe-area-inset-top);
      right: env(safe-area-inset-right);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
    }
    /*
     * Splash: the app icon acts out its name. A whole ring, the bar drops through it, the two
     * halves slide apart, the name fades in; then the halves breathe until the app is ready,
     * and the whole thing fades away. Pure CSS, so it plays before any app code has loaded.
     * It sits above #app with the page's own background, so the app's first frame cannot
     * flash through it.
     */
    #splash {
      --ink: #ffffff;
      --bg: #121212;
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      color: var(--ink);
      transition: opacity 320ms ease, transform 320ms ease;
    }
    @media (prefers-color-scheme: light) {
      #splash { --ink: #121212; --bg: #ffffff; }
    }
    #splash.done { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #splash svg { width: 112px; height: 112px; overflow: visible; }
    #splash .half, #splash .bar, #splash .breathe { transform-box: fill-box; }
    #splash .bar { transform-origin: 50% 0; animation: splits-bar 380ms 150ms cubic-bezier(.3,.7,.2,1) both; }
    #splash .left { animation: splits-left 520ms 480ms cubic-bezier(.2,1.4,.4,1) both; }
    #splash .right { animation: splits-right 520ms 480ms cubic-bezier(.2,1.4,.4,1) both; }
    #splash .left .breathe { animation: splits-breathe-left 1600ms 1100ms ease-in-out infinite; }
    #splash .right .breathe { animation: splits-breathe-right 1600ms 1100ms ease-in-out infinite; }
    #splash .ring { transform-box: fill-box; transform-origin: 50% 50%; animation: splits-in 300ms both; }
    #splash .name {
      font: 600 26px -apple-system, system-ui, sans-serif;
      letter-spacing: 0.5px;
      animation: splits-name 420ms 760ms ease-out both;
    }
    @keyframes splits-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
    @keyframes splits-bar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes splits-left { from { transform: translateX(0); } to { transform: translateX(-18px); } }
    @keyframes splits-right { from { transform: translateX(0); } to { transform: translateX(18px); } }
    @keyframes splits-breathe-left { 0%, 100% { transform: none; } 50% { transform: translateX(-6px); } }
    @keyframes splits-breathe-right { 0%, 100% { transform: none; } 50% { transform: translateX(6px); } }
    @keyframes splits-name { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash *::before { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; }
    }
    #unsupported { display: none; padding: 24px; font: 16px -apple-system, system-ui, sans-serif; color: #888; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Splits is loading" role="img">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <g class="ring">
        <g class="half left"><path class="breathe" fill="#7C5CFF"
          d="M256 71A185 185 0 0 0 256 441L256 356A100 100 0 0 1 256 156Z"/></g>
        <g class="half right"><path class="breathe" fill="#33D1AE"
          d="M256 71A185 185 0 0 1 256 441L256 356A100 100 0 0 0 256 156Z"/></g>
        <rect class="bar" x="247" y="36" width="18" height="440" rx="2" fill="currentColor"/>
      </g>
    </svg>
    <div class="name">Splits</div>
  </div>
  <div id="unsupported">
    This browser cannot run Splits. On iPhone it needs iOS 18.2 or newer; elsewhere, a recent
    Chrome, Firefox or Safari.
  </div>
  <div id="app"></div>

  <script>
    // Called by the app (main.kt) once its first screen is ready. Lets the intro finish first,
    // so a quick launch does not cut the animation off halfway, then fades the splash out.
    (function () {
      var shownAt = Date.now();
      var INTRO_MS = 1200;
      window.splitsHideSplash = function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        setTimeout(function () {
          splash.classList.add('done');
          setTimeout(function () { splash.remove(); }, 340);
        }, Math.max(0, INTRO_MS - (Date.now() - shownAt)));
      };
    })();
    // Kotlin/Wasm needs WasmGC (Safari 18.2+). Say so instead of showing a blank screen.
    (function () {
      var ok = typeof WebAssembly === 'object' && WebAssembly.validate(new Uint8Array([
        0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0
      ]));
      if (!ok) {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('unsupported').style.display = 'block';
        window.__splitsUnsupported = true;
      }
    })();
    // Safari on iPhone draws nothing without this: Compose renders every frame into its WebGL
    // canvas (the pixels are there), but with Safari's own requestAnimationFrame those frames
    // never reach the screen, leaving the page blank after the splash. Calling Compose's
    // callback from a plain JS function instead makes Safari present them. Found by bisecting
    // in the iOS simulator; harmless everywhere else.
    (function () {
      var raf = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = function (callback) {
        return raf(function (time) { callback(time); });
      };
    })();
    // A Home Screen app has no console to look at, so a crash would only ever be a blank
    // screen. Put the error on screen instead, where it can be read and reported.
    (function () {
      function show(message) {
        var box = document.getElementById('crash');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'crash';
          box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));' +
            'z-index:9;margin:0;padding:12px;max-height:40%;overflow:auto;white-space:pre-wrap;' +
            'font:12px ui-monospace,monospace;color:#fff;background:#b00020;border-radius:8px;' +
            '-webkit-user-select:text;user-select:text;';
          document.body.appendChild(box);
        }
        box.textContent += (box.textContent ? '\n' : 'Splits hit an error:\n') + message;
      }
      window.addEventListener('error', function (e) {
        // A bare "Script error." with no file comes from a script we cannot see into: on
        // iPhone, Safari's own page scripts raise one when the share sheet or page menu opens.
        // Splits' scripts are same-origin and sql.js is loaded with CORS, so their errors
        // always carry details; this one carries nothing to report.
        if (!e.filename && !e.error) return;
        show(String(e.message || e.error) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show(String(r && (r.stack || r.message) || r));
      });
    })();
    if ('serviceWorker' in navigator) {
      // updateViaCache 'none': look for a new sw.js on every launch, not from the HTTP cache.
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
    }
  </script>
  <script src="sqlite-bridge.js"></script>
  <script>
    if (!window.__splitsUnsupported) {
      var s = document.createElement('script');
      s.src = 'splits.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
